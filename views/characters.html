<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色管理 · Wayhug AI Engine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <h1><span class="logo">🦊</span>Wayhug AI Engine</h1>
      <ul class="nav-links">
        <li><a href="/">控制台</a></li>
        <li><a href="/characters" class="active">角色</a></li>
        <li><a href="/contents">内容</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="card-title">🐾 内置角色</div>
      <div class="char-grid" id="charGrid">
        <div class="empty" style="grid-column: 1/-1;">加载中...</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Wayhug AI Engine MVP · MIT License © 2026 王元会</p>
    <p>备案号：苏ICP备17031763号-6</p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function loadCharacters() {
      const res = await fetch('/api/characters');
      const json = await res.json();
      const grid = document.getElementById('charGrid');
      if (json.data.length === 0) {
        grid.innerHTML = '<div class="empty"><div class="empty-emoji">🐾</div>暂无角色</div>';
        return;
      }
      grid.innerHTML = json.data.map(c => `
        <div class="char-card">
          <div class="char-emoji">${c.emoji}</div>
          <div class="char-name">${c.name}</div>
          <div class="char-species">${c.species}</div>
          <div style="margin-top: 0.6rem; font-size: 0.78rem; color: var(--text-light); line-height: 1.5;">${c.personality}</div>
          <div style="margin-top: 0.5rem;">
            ${c.styleTags.map(t => `<span class="tag">${t}</span>`).join(' ')}
          </div>
        </div>
      `).join('');
    }
    loadCharacters();
  </script>
</body>
</html>
