<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容详情 · Wayhug AI Engine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <h1><span class="logo">🦊</span>Wayhug AI Engine</h1>
      <ul class="nav-links">
        <li><a href="/">控制台</a></li>
        <li><a href="/characters">角色</a></li>
        <li><a href="/contents" class="active">内容</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="card" id="detailCard">
      <div class="empty">加载中...</div>
    </div>
  </div>

  <div class="footer">
    <p>Wayhug AI Engine MVP · MIT License © 2026 王元会</p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const id = window.location.pathname.split('/').pop();

    async function loadDetail() {
      const res = await fetch(`/api/contents/${id}`);
      const json = await res.json();
      const card = document.getElementById('detailCard');

      if (json.code !== 0) {
        card.innerHTML = `<div class="empty"><div class="empty-emoji">😕</div>${json.message || '内容不存在'}</div>`;
        return;
      }

      const c = json.data;
      const body = Array.isArray(c.paragraphs)
        ? c.paragraphs.map(p => `<p style="margin-bottom: 1rem; line-height: 1.9;">${p}</p>`).join('')
        : `<p style="line-height: 1.9; font-size: 1.05rem;">${c.text || ''}</p>`;

      card.innerHTML = `
        <div style="margin-bottom: 1rem;">
          <a href="/contents" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">← 返回列表</a>
        </div>
        <h2 style="margin-bottom: 0.5rem;">${c.title || c.topic || '无标题'}</h2>
        <div style="color: var(--text-light); font-size: 0.85rem; margin-bottom: 1.5rem;">
          ${c.character?.emoji || ''} ${c.character?.name || ''} · 情绪：${c.moodName || ''} · ${new Date(c.createdAt).toLocaleString('zh-CN')}
        </div>
        <div>${body}</div>
        <div style="margin-top: 2rem; display: flex; gap: 0.8rem;">
          <a class="btn" href="/contents/${c.id}/pdf" target="_blank">📄 导出 PDF</a>
          <a class="btn btn-outline" href="/">去生成更多</a>
        </div>
      `;
    }
    loadDetail();
  </script>
</body>
</html>
